<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Native</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #faf8f3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  .logo {
    width: 88px;
    height: 88px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    color: #1f3d2b;
    margin: 0 0 10px;
  }
  p {
    font-size: 14px;
    color: #666;
    margin: 0 0 28px;
    max-width: 320px;
    line-height: 1.5;
  }
  button {
    background: #c28b45;
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/brand/native_logo_512.png" alt="Native" />
    <h1>You're offline</h1>
    <p>We couldn't reach Native. Check your internet connection and try again.</p>
    <button id="retryBtn" type="button">Try Again</button>
  </div>
  <script>
    document.getElementById("retryBtn").addEventListener("click", function () {
      window.location.replace("https://shopnative.in/");
    });
  </script>
</body>
</html>
